<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Litora Books Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Hanken+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="wrap"><span class="logo">Litora Admin</span><button class="btn alt sm" id="th">Theme</button><button class="btn alt sm" id="out" hidden>Sign out</button></div></header>
<main class="wrap">
<section id="login" style="max-width:380px;margin:3rem auto"><h2>Admin sign in</h2><form id="fl"><label>Email</label><input id="em" type="email" required><label>Password</label><input id="pw" type="password" required>
<div id="lM"></div><p><button class="btn">Sign in</button></p></form></section>
<section id="app" hidden><div class="tabs" id="tabs"></div><div id="msg"></div><div id="pane"></div></section></main>
<dialog id="dB"><h2 id="dT">Add e-book</h2><form id="bf"><input type="hidden" name="id">
<label>Title</label><input name="title" required><label>Subtitle</label><input name="subtitle"><div class="row2"><div><label>Author</label><input name="author" required></div><div><label>Category</label><input name="category"></div></div>
<label>Description</label><textarea name="description" rows="4"></textarea><label>Tags (comma separated)</label><input name="tags">
<div class="row2"><div><label>Price (₹)</label><input name="price" type="number" min="0" step="0.01" required></div><div><label>Original price (₹, optional)</label><input name="orig" type="number" min="0" step="0.01"></div></div>
<div class="row2"><div><label>Language</label><input name="language" value="English"></div><div><label>Pages</label><input name="pages" type="number" min="1"></div></div>
<label>Cover image (JPG/PNG/WebP, max 5 MB)</label><input name="cover" type="file" accept="image/*"><label>Book PDF (max 50 MB)</label><input name="pdf" type="file" accept="application/pdf">
<label><input type="checkbox" name="featured" style="width:auto"> Featured</label><div id="bM"></div>
<p><button class="btn alt" value="draft">Save draft</button> <button class="btn" value="published">Publish</button> <button type="button" class="btn alt" onclick="dB.close()">Cancel</button></p></form></dialog>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>window.addEventListener('error',function(e){document.body.insertAdjacentHTML('afterbegin','<div style="background:#b3412f;color:#fff;padding:1rem;font:16px sans-serif">Error: '+e.message+'</div>')});window.addEventListener('unhandledrejection',function(e){document.body.insertAdjacentHTML('afterbegin','<div style="background:#b3412f;color:#fff;padding:1rem;font:16px sans-serif">Error: '+(e.reason&&e.reason.message||e.reason)+'</div>')});</script>
<script>(function(){var c=window.LITORA;if(!c||!c.SUPABASE_URL||!c.SUPABASE_KEY||!window.supabase){document.body.insertAdjacentHTML('afterbegin','<div style="background:#b3412f;color:#fff;padding:1rem;font:16px sans-serif">Setup problem: '+(!c?'config.js was not found. Keep it in the same folder as this file and check the name is exactly config.js (not config.js.txt).':!c.SUPABASE_URL||!c.SUPABASE_KEY?'config.js is empty. Paste your Supabase URL and anon key between the quotes.':'The Supabase library did not load. Check your internet connection.')+'</div>');throw new Error('Litora setup incomplete')}})()</script>
<script>
const L=window.LITORA,$=s=>document.querySelector(s),sb=supabase.createClient(L.SUPABASE_URL,L.SUPABASE_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=p=>'₹'+((p||0)/100).toLocaleString('en-IN'),day=()=>new Date().toISOString().slice(0,10);
let books=[],orders=[],users=[],tab='Overview',tm=localStorage.ath||'light';
const ap=()=>{document.documentElement.dataset.theme=tm;$('#th').textContent='Admin theme: '+tm};$('#th').onclick=()=>{tm=tm==='light'?'dark':'light';localStorage.ath=tm;ap()};ap();
const note=(t,err)=>$('#msg').innerHTML=`<div class="msg ${err?'err':''}">${esc(t)}</div>`;
async function boot(){const{data:{session}}=await sb.auth.getSession();$('#login').hidden=!!session;$('#app').hidden=!session;$('#out').hidden=!session;if(!session)return;
 const{data:ok}=await sb.rpc('is_admin');if(!ok){await sb.auth.signOut();$('#login').hidden=false;$('#app').hidden=true;$('#out').hidden=true;$('#lM').innerHTML='<div class="msg err">This account is not an administrator.</div>';return}
 await refresh()}
$('#fl').onsubmit=async e=>{e.preventDefault();const m=$('#lM');m.innerHTML='<div class="msg">Signing in…</div>';
 try{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){m.innerHTML=`<div class="msg err">${esc(error.message)}</div>`;return}
  m.innerHTML='<div class="msg">Signed in. Checking admin access…</div>';await boot()}
 catch(x){m.innerHTML=`<div class="msg err">${esc(x.message||x)}</div>`}};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function refresh(){const[b,o,u]=await Promise.all([sb.from('books').select('*').order('created_at',{ascending:false}),sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('*').order('created_at',{ascending:false})]);
 const e=b.error||o.error||u.error;if(e)return note(e.message,1);books=b.data;orders=o.data;users=u.data;render()}
function render(){$('#tabs').innerHTML=['Overview','Books','Orders','Users','Exports'].map(t=>`<button class="btn ${t===tab?'on':'alt'}" data-t="${t}">${t}</button>`).join('');$('#pane').innerHTML=views[tab]()}
$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;$('#msg').innerHTML='';render()}};
const paid=()=>orders.filter(o=>o.status==='paid'),sum=a=>a.reduce((s,o)=>s+(o.amount_paise||0),0);
const views={
Overview:()=>{const rf=orders.filter(o=>o.status==='refunded');const top={};paid().forEach(o=>top[o.title]=(top[o.title]||0)+1);
 const st=[['Registered users',users.length],['Published books',books.filter(b=>b.status==='published').length],['Draft books',books.filter(b=>b.status==='draft').length],['Paid orders',paid().length],['Pending orders',orders.filter(o=>o.status==='pending').length],['Gross sales',inr(sum(paid())+sum(rf))],['Refunds',inr(sum(rf))],['Net sales',inr(sum(paid()))]];
 return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding:0">${st.map(([k,v])=>`<div class="msg" style="margin:0"><div class="mu">${k}</div><h2>${v}</h2></div>`).join('')}</div>
 <p class="mu">Net sales = paid orders only (refunded orders are excluded). Gross = paid + refunded.</p><h3>Bestsellers</h3>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([t,n])=>`<div>${esc(t)}: ${n}</div>`).join('')||'<p class="mu">No paid orders yet.</p>'}`},
Books:()=>`<p><button class="btn" onclick="edit()">Add e-book</button></p><div class="scroll"><table><tr><th>Title</th><th>Status</th><th>Price</th><th>Actions</th></tr>${books.map(b=>`<tr><td>${esc(b.title)}<br><span class="mu">${esc(b.author)}</span></td><td><span class="tag">${b.status}</span></td><td>${inr(b.price_paise)}</td><td>
 <button class="btn sm alt" onclick="edit('${b.id}')">Edit</button> ${b.status==='published'?`<button class="btn sm alt" onclick="setSt('${b.id}','draft')">Unpublish</button>`:`<button class="btn sm" onclick="setSt('${b.id}','published')">Publish</button>`}
 ${b.status==='archived'?`<button class="btn sm alt" onclick="setSt('${b.id}','draft')">Restore</button>`:`<button class="btn sm alt" onclick="setSt('${b.id}','archived')">Archive</button>`}
 <button class="btn sm alt" onclick="dup('${b.id}')">Duplicate</button> <button class="btn sm red" onclick="del('${b.id}')">Delete</button></td></tr>`).join('')}</table></div>${books.length?'':'<p class="mu">No books yet. Add your first e-book.</p>'}`,
Orders:()=>`<div class="scroll"><table><tr><th>Ref</th><th>Book</th><th>Customer</th><th>Amount</th><th>Status</th><th></th></tr>${orders.map(o=>{const u=users.find(x=>x.id===o.user_id);return `<tr><td>${o.ref}<br><span class="mu">${new Date(o.created_at).toLocaleString('en-IN')}</span></td><td>${esc(o.title)}</td><td>${esc(u?.email||'')}</td><td>${inr(o.amount_paise)}</td><td><span class="tag">${o.status}</span></td><td>
 ${o.status==='pending'?`<button class="btn sm" onclick="ord('${o.id}','paid')">Approve</button> <button class="btn sm red" onclick="ord('${o.id}','rejected')">Reject</button>`:o.status==='paid'?`<button class="btn sm alt" onclick="ord('${o.id}','refunded')">Refund</button>`:''}</td></tr>`}).join('')}</table></div>${orders.length?'':'<p class="mu">No orders yet.</p>'}`,
Users:()=>`<input id="uq" placeholder="Search name, email or user ID" oninput="uf()"><div class="scroll"><table id="ut"></table></div>`,
Exports:()=>`<p>Genuine .xlsx files. Passwords and tokens are never included.</p><p><button class="btn" onclick="xUsers()">Export users</button> <button class="btn alt" onclick="xStore()">Export store data</button></p><p class="mu">Amount spent = paid orders only (net of refunds).</p>`};
function uf(){const q=($('#uq')?.value||'').toLowerCase();$('#ut').innerHTML='<tr><th>User</th><th>Joined</th><th>Orders</th><th>Spent</th><th>Status</th><th></th></tr>'+users.filter(u=>[u.name,u.email,u.id].join(' ').toLowerCase().includes(q)).map(u=>{const p=paid().filter(o=>o.user_id===u.id);
 return `<tr><td>${esc(u.name||'')}<br><span class="mu">${esc(u.email)}</span></td><td>${new Date(u.created_at).toLocaleDateString('en-IN')}</td><td>${p.length}</td><td>${inr(sum(p))}</td><td>${u.is_suspended?'Suspended':'Active'}</td><td><button class="btn sm alt" onclick="susp('${u.id}',${!u.is_suspended})">${u.is_suspended?'Reactivate':'Suspend'}</button></td></tr>`}).join('')}
const _r=render;render=function(){_r();if(tab==='Users')uf()};
async function setSt(id,status){const b=books.find(x=>x.id===id);if(status==='published'&&!b.file_path)return note('Upload a PDF before publishing.',1);const{error}=await sb.from('books').update({status,updated_at:new Date()}).eq('id',id);error?note(error.message,1):(note('Updated.'),refresh())}
async function del(id){if(!confirm('Delete this book? Past orders keep their title and price, but buyers lose access. Archive instead if unsure.'))return;const{error}=await sb.from('books').delete().eq('id',id);error?note(error.message,1):(note('Deleted.'),refresh())}
async function dup(id){const{id:_,created_at,updated_at,...b}=books.find(x=>x.id===id);const{error}=await sb.from('books').insert({...b,title:b.title+' (copy)',status:'draft'});error?note(error.message,1):(note('Duplicated as draft.'),refresh())}
async function ord(id,status){if(!confirm('Mark this order '+status+'?'))return;const{error}=await sb.from('orders').update({status}).eq('id',id);error?note(error.message,1):(note('Order '+status+'.'),refresh())}
async function susp(id,v){const{error}=await sb.from('profiles').update({is_suspended:v}).eq('id',id);error?note(error.message,1):refresh()}
function edit(id){const b=books.find(x=>x.id===id)||{},f=$('#bf');f.reset();$('#dT').textContent=id?'Edit e-book':'Add e-book';$('#bM').innerHTML='';
 Object.entries({id:b.id||'',title:b.title,subtitle:b.subtitle,author:b.author,category:b.category,description:b.description,tags:(b.tags||[]).join(', '),price:b.price_paise/100,orig:b.original_price_paise?b.original_price_paise/100:'',language:b.language||'English',pages:b.pages}).forEach(([k,v])=>f.elements[k].value=v??'');f.elements.featured.checked=!!b.featured;$('#dB').showModal()}
const clean=n=>n.replace(/[^\w.-]/g,'_');
$('#bf').onsubmit=async e=>{e.preventDefault();const f=e.target,status=e.submitter.value,fd=new FormData(f),id=fd.get('id')||crypto.randomUUID(),old=books.find(b=>b.id===id)||{},m=$('#bM');
 const row={id,title:fd.get('title').trim(),subtitle:fd.get('subtitle'),author:fd.get('author').trim(),category:fd.get('category'),description:fd.get('description'),tags:fd.get('tags').split(',').map(s=>s.trim()).filter(Boolean),
 price_paise:Math.round(fd.get('price')*100),original_price_paise:fd.get('orig')?Math.round(fd.get('orig')*100):null,language:fd.get('language'),pages:fd.get('pages')?+fd.get('pages'):null,featured:f.elements.featured.checked,status,updated_at:new Date()};
 const cv=fd.get('cover'),pdf=fd.get('pdf');
 try{if(cv.size){if(!/^image\/(jpeg|png|webp)$/.test(cv.type)||cv.size>5e6)throw Error('Cover must be a JPG, PNG or WebP under 5 MB.');m.innerHTML='<div class="msg">Uploading cover…</div>';const p=`${id}/${Date.now()}-${clean(cv.name)}`;const r=await sb.storage.from('covers').upload(p,cv);if(r.error)throw r.error;row.cover_path=p}
  if(pdf.size){if(pdf.type!=='application/pdf'||pdf.size>5e7)throw Error('Book file must be a PDF under 50 MB.');m.innerHTML='<div class="msg">Uploading PDF… keep this tab open.</div>';const p=`${id}/${Date.now()}-${clean(pdf.name)}`;const r=await sb.storage.from('book-files').upload(p,pdf);if(r.error)throw r.error;row.file_path=p}
  if(status==='published'&&!(row.file_path||old.file_path))throw Error('Upload the PDF before publishing.');
  const w=await sb.from('books').upsert(row);if(w.error)throw w.error;
  const v=await sb.from('books').select('id,status').eq('id',id).single();if(v.error||v.data.status!==status)throw Error('Save could not be verified.');
  $('#dB').close();note(status==='published'?'Published. It is now live in the store.':'Draft saved.');refresh()}catch(x){m.innerHTML=`<div class="msg err">${esc(x.message)}</div>`}};
// Excel: stop =,+,-,@ cells from running as formulas
const safe=v=>typeof v==='string'&&/^[=+\-@\t\r]/.test(v)?"'"+v:v;
function sheet(rows){const ws=XLSX.utils.json_to_sheet(rows.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,safe(v)]))));ws['!cols']=Object.keys(rows[0]||{A:1}).map(()=>({wch:24}));return ws}
const uRows=()=>users.map(u=>{const p=paid().filter(o=>o.user_id===u.id);return{'User ID':u.id,'Full Name':u.name||'','Email Address':u.email,'Mobile Number':u.mobile||'','Account Created At':u.created_at,'Account Status':u.is_suspended?'Suspended':'Active','Country':u.country||'','Theme Preference':u.theme,'Total Successful Orders':p.length,'Total Amount Spent (INR, paid orders)':sum(p)/100}});
async function audit(a){const{data:{user}}=await sb.auth.getUser();await sb.from('audit').insert({admin_id:user.id,action:a})}
async function xUsers(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(uRows()),'Users');XLSX.writeFile(wb,`Litora_Books_Users_${day()}.xlsx`);await audit('export_users');note('Users exported '+new Date().toLocaleString('en-IN'))}
async function xStore(){const wb=XLSX.utils.book_new(),A=XLSX.utils.book_append_sheet;A(wb,sheet(uRows()),'Users');
 A(wb,sheet(books.map(b=>({'Book ID':b.id,Title:b.title,Author:b.author,Category:b.category||'','Price (INR)':b.price_paise/100,Status:b.status,Featured:b.featured,'Created At':b.created_at}))),'Books');
 A(wb,sheet(orders.map(o=>({'Order ID':o.id,Ref:o.ref,'User ID':o.user_id,'Book ID':o.book_id||'','Title (at purchase)':o.title,'Amount (INR)':o.amount_paise/100,Status:o.status,'Created At':o.created_at}))),'Orders');
 XLSX.writeFile(wb,`Litora_Books_Store_${day()}.xlsx`);await audit('export_store');note('Store data exported '+new Date().toLocaleString('en-IN'))}
boot();
</script></body></html>
